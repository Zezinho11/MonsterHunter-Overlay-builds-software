<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunter Companion</title>
    <link rel="stylesheet" href="control.css" />
    <link rel="stylesheet" href="detail-guide.css" />
    <link rel="stylesheet" href="catalog-guide.css" />
    <link rel="stylesheet" href="shell-guide.css" />
    <link rel="stylesheet" href="profile-guide.css" />
    <link rel="stylesheet" href="sidebar-profile-guide.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="app-brand"><span class="brand-mark">✥</span><div class="brand-copy">Hunter<br>Companion<small>SEMPRE AO LADO<br>DA SUA CAÇADA</small></div></div>
        <div class="profile-card">
          <button id="avatar-button" class="avatar" title="Alterar perfil">Z</button>
          <strong id="profile-name">NomeCaçador</strong>
          <small id="profile-status">Caçador offline</small>
          <input id="avatar-input" type="file" accept="image/*" hidden />
        </div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item" data-view="bestiary"><span><svg viewBox="0 0 32 32"><path d="M16 8Q9 3 2 5v23q7-3 14 0 7-3 14 0V5q-7-2-14 3Z M16 8v20"/></svg></span> Monsterpedia</button>
          <button class="nav-item active" data-view="online-builds"><span><svg viewBox="0 0 32 32"><path d="m5 3 24 24-3 3L2 6ZM27 3 3 27l3 3L30 6ZM2 22l8 8M22 2l8 8"/></svg></span> Builds online</button>
          <button class="nav-item" data-view="saved-builds"><span><svg viewBox="0 0 32 32"><path d="M4 9h24v20H4ZM11 9V4h10v5M4 15h24M13 15v6h6v-6"/></svg></span> Builds registradas</button>
          <button class="nav-item" data-view="overlay-settings"><span><svg viewBox="0 0 32 32"><path d="M2 4h28v20H2ZM12 24v5h8v-5M8 29h16M6 8h20v12H6"/></svg></span> Overlay</button>
          <button class="nav-item settings-button" data-view="app-settings" title="Perfil e configurações"><span><svg viewBox="0 0 32 32"><path d="m13 2 6 0 1 5 4 2 5-1 2 6-4 3-1 4 2 5-5 3-4-3-4 0-4 3-5-3 2-5-1-4-4-3 2-6 5 1 3-2Z"/><circle cx="16" cy="16" r="5"/></svg></span> Configurações</button>
        </nav>
        <div class="sidebar-legend">Mais que monstros,<br>grandes histórias.</div>
      </aside>
      <section class="content-shell">
        <header class="content-header"><div class="content-header-title"><span class="section-kicker">HUNTER COMPANION</span><div class="content-header-line"><h1 id="view-title">Builds online</h1><div id="detail-header-actions" class="detail-header-actions" hidden></div></div></div><div class="header-actions"><span id="connection-label" class="connection-pill"><i></i> Modo de simulação · nenhum jogo detectado</span><button id="profile-header" class="profile-header">Z <span id="header-profile-name">NomeCaçador</span></button></div></header>
        <div id="view-root" class="view-root"></div>
      </section>
    </main>
    <script src="builds/local-store.js"></script>
    <script src="data/build-equipment-catalog.v1.js"></script>
    <script src="builds/equipment-catalog.js"></script>
    <script src="data/monster-catalog.v1.js"></script>
    <script src="profile-view.js"></script>
    <script src="control.js"></script>
  </body>
</html>
